<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HORIZONE AI · Login</title>
    <link rel="stylesheet" href="/static/CSS/login.css">

    <script type="module" src="/static/JS/login.js"></script>
</head>
<body class="auth-body" data-page="login">
    <main class="auth-layout">
        <section class="auth-card">
            <h1>HORIZONE lite</h1>
            <p class="muted">
                A private, lightweight workspace for projects, profiles, and persistent conversations on your own machine.
            </p>

            <form id="login-form" class="form-stack">
                <label for="username">
                    <span>Username</span>
                    <input type="text" name="username" id="username" placeholder="admin" required>
                </label>

                <label for="password">
                    <span>Password</span>
                    <input type="password" name="password" id="password" placeholder="admin" required>
                </label>

                <div id="error-message" class="error-message" aria-live="polite"></div>
                <button class="button button--primary" type="submit">Sign in</button>
            </form>
        </section>

        <section class="auth-card auth-card--secondary">
            <div class="auth-brand">
                <a class="brand auth-brand__signature" href="/login" aria-label="HORIZONE AI login">
                    <img class="brand__logo" src="/static/assets/logos/HORIZONE_FULL_LOGO.PNG" alt="HORIZONE AI">
                </a>
            </div>

            <div class="section-heading section-heading--compact">
                <div>
                    <p class="eyebrow">Local access</p>
                </div>
            </div>

            <ul class="credential-list">
                <li><strong>Administrador</strong>: <code>admin</code> / <code>admin</code></li>
            </ul>

            <div class="auth-note">
                Switch providers, keep your conversations, and work with system profiles from a local-first interface.
            </div>
        </section>
    </main>
</body>
</html>
